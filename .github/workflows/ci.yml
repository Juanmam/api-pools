name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -U pip -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests compliance_cli

      - name: Mypy
        run: python -m mypy -p apipools

      - name: Pytest with coverage
        run: python -m pytest --cov=apipools --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -U pip -e ".[docs]"

      - name: Sphinx
        working-directory: docs
        run: python -m sphinx -b html source build/html
